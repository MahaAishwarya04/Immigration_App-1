services:
  postgres:
    image: postgres:15
    container_name: immigration-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immigration_db
      POSTGRES_USER: immigration_user
      POSTGRES_PASSWORD: immigration_password
    ports:
      - "5432:5432"
    volumes:
      - immigration_pgdata:/var/lib/postgresql/data

volumes:
  immigration_pgdata:
